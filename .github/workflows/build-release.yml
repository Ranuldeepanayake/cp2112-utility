# Triggers on develop-to-main pull requests when opened or merged, and on
# manual workflow dispatches from develop only.
name: Build and release CP2112 utility

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - closed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    # PR builds are limited to an open/merged PR from develop to main.
    # Manual runs are accepted only when the selected ref is develop.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' &&
       (github.event.action == 'opened' ||
        (github.event.action == 'closed' && github.event.pull_request.merged == true)) &&
       github.event.pull_request.head.ref == 'develop' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.base.ref == 'main')
    runs-on: windows-2025

    # Action: use the exact same native MinGW-w64 toolchain for every CI build.
    steps:
      # Action: cache the pinned archive and extracted toolchain between runs.
      - name: Cache pinned WinLibs toolchain
        id: winlibs-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/winlibs-x86_64-16.2.0.7z
            ${{ runner.temp }}/winlibs-x86_64-16.2.0
          key: winlibs-windows-2025-x86_64-16.2.0-mcf-seh-ucrt-rt_v14-rev1

      - name: Use pinned WinLibs toolchain
        shell: pwsh
        env:
          WINLIBS_URL: https://github.com/niXman/mingw-builds-binaries/releases/download/16.2.0-rt_v14-rev1/x86_64-16.2.0-release-mcf-seh-ucrt-rt_v14-rev1.7z
          WINLIBS_SHA256: f4f9a32681afd5862bdc060dfcf51169e3fc7b4854c1d6d304ba249a51f1df2a
        run: |
          # Define the archive and extraction locations inside the runner's temporary directory.
          $archive = Join-Path $env:RUNNER_TEMP 'winlibs-x86_64-16.2.0.7z'
          $toolchainRoot = Join-Path $env:RUNNER_TEMP 'winlibs-x86_64-16.2.0'

          # Download the archive only when the cache did not restore it.
          if (-not (Test-Path $archive)) {
            Write-Host 'WinLibs archive was not restored from cache; downloading it.'
            Invoke-WebRequest -Uri $env:WINLIBS_URL -OutFile $archive
          } else {
            Write-Host 'Using the cached WinLibs archive.'
          }

          # Verify the downloaded or cached archive before using it.
          $actualHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:WINLIBS_SHA256) {
            throw "WinLibs SHA-256 mismatch. Expected $env:WINLIBS_SHA256, received $actualHash"
          }

          # Confirm that the runner has the extraction utility.
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            throw '7z.exe was not found on the GitHub runner.'
          }
          # Reuse an extracted compiler when the extraction directory was cached.
          $compiler = Get-ChildItem -Path $toolchainRoot -Filter 'g++.exe' -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'bin' } |
            Select-Object -First 1
          if (-not $compiler) {
            # Remove an incomplete extraction and unpack a fresh copy.
            if (Test-Path $toolchainRoot) {
              Remove-Item -Path $toolchainRoot -Recurse -Force
            }
            New-Item -ItemType Directory -Force $toolchainRoot | Out-Null
            7z x $archive "-o$toolchainRoot" -y | Out-Host
            if ($LASTEXITCODE -ne 0) {
              throw "WinLibs extraction failed with exit code $LASTEXITCODE"
            }
          }

          # Locate the compiler, persist its bin directory for later steps, and report its identity.
          $compiler = Get-ChildItem -Path $toolchainRoot -Filter 'g++.exe' -Recurse |
            Where-Object { $_.Directory.Name -eq 'bin' } |
            Select-Object -First 1
          if (-not $compiler) {
            throw "g++.exe was not found in the extracted WinLibs archive: $toolchainRoot"
          }
          $compilerBin = $compiler.Directory.FullName
          # Keep the CLI toolchain addressable after the Qt action changes PATH.
          "CP2112_WINLIBS_BIN=$compilerBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $compilerBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$compilerBin;$env:Path"
          Write-Host "Using pinned compiler from $compilerBin"
          & (Join-Path $compilerBin 'g++') --version
          & (Join-Path $compilerBin 'g++') -dumpmachine

      # Action: check out the exact source revision that will be compiled.
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Build the develop source for PR events, rather than the synthetic
          # merge ref GitHub creates for pull_request workflows.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.pull_request.head.sha }}

      # Action: create distinct executable and package names with the build
      # timestamp, run number, and beta/production state.
      - name: Create release names
        id: package
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Build the timestamped beta or production state used in all CI names.
          $timestamp = Get-Date -Format 'ddMMyyyyHHmm'
          $isBeta = -not ('${{ github.event.action }}' -eq 'closed' -and '${{ github.event.pull_request.merged }}' -eq 'true')
          $state = if ($isBeta) { 'beta' } else { 'release' }
          $executableName = 'cp2112_console'
          $packageSuffix = if ($isBeta) { '-beta' } else { '' }
          $packageName = "cp2112_utility-$timestamp-$env:GITHUB_RUN_NUMBER$packageSuffix"
          $beta = if ($isBeta) { 'true' } else { 'false' }
          # Publish the generated values to subsequent workflow steps.
          "executable_name=$executableName" >> $env:GITHUB_OUTPUT
          "package_name=$packageName" >> $env:GITHUB_OUTPUT
          "build_timestamp=$timestamp" >> $env:GITHUB_OUTPUT
          "build_number=$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT
          "beta=$beta" >> $env:GITHUB_OUTPUT
          "state=$state" >> $env:GITHUB_OUTPUT

      # Action: prepare CI build metadata in the working copy for this build.
      - name: Prepare packaged build metadata
        shell: pwsh
        env:
          BUILD_TIMESTAMP: ${{ steps.package.outputs.build_timestamp }}
          BUILD_NUMBER: ${{ steps.package.outputs.build_number }}
          BETA: ${{ steps.package.outputs.beta }}
        run: |
          # Load the checked-in configuration that will be included in the package.
          $configPath = 'config\devices.ini'
          $config = Get-Content $configPath -Raw

          # Replace only CI-managed metadata; preserve all device settings.
          $config = [regex]::Replace($config, '(?m)^build_timestamp=.*$', "build_timestamp=$env:BUILD_TIMESTAMP")
          $config = [regex]::Replace($config, '(?m)^build_number=.*$', "build_number=$env:BUILD_NUMBER")
          $config = [regex]::Replace($config, '(?m)^beta=.*$', "beta=$env:BETA")
          Set-Content -Path $configPath -Value $config -Encoding utf8

      # Action: verify that the README-required MinGW-w64 C++ toolchain exists.
      - name: Check MinGW-w64 toolchain
        shell: pwsh
        run: |
          # Confirm that the separately pinned CLI compiler is available.
          $compilerPath = Join-Path $env:CP2112_WINLIBS_BIN 'g++.exe'
          if (-not (Test-Path $compilerPath)) {
            throw "The pinned WinLibs compiler was not found: $compilerPath"
          }
          # Confirm that the selected compiler targets 64-bit Windows.
          & $compilerPath --version
          $target = (& $compilerPath -dumpmachine).Trim()
          if ($target -notmatch 'x86_64|amd64') {
            throw "The available g++ is not the required 64-bit MinGW toolchain: $target"
          }

          # Confirm that the same pinned toolchain provides the Windows resource compiler.
          $resourceCompiler = Join-Path $env:CP2112_WINLIBS_BIN 'windres.exe'
          if (-not (Test-Path $resourceCompiler)) {
            throw "windres was not found beside the pinned MinGW-w64 toolchain: $resourceCompiler"
          }
          & $resourceCompiler --version

      # Action: compile the multi-resolution executable icon resource.
      - name: Build Windows icon resource
        shell: pwsh
        run: |
          # Keep intermediate resource objects outside bin so they are not packaged.
          New-Item -ItemType Directory -Force build | Out-Null

          # Convert the .rc definition and .ico image into a linkable COFF object.
          & (Join-Path $env:CP2112_WINLIBS_BIN 'windres.exe') resources\app.rc -O coff -o build\app-res.o
          if ($LASTEXITCODE -ne 0) {
            throw "windres failed with exit code $LASTEXITCODE"
          }

      # Action: install the cached Qt Widgets package required by the GUI build.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: windows
          target: desktop
          arch: win64_mingw
          archives: qtbase
          # Install the MinGW 13.1 toolchain used to build Qt 6.12 MinGW kits.
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
          cache: true
          # Qt 6.12 uses the newer per-architecture repository metadata layout.
          # The released PyPI aqtinstall package used by the action cannot read it.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git'
          # Keep this cache separate from other Qt versions and architectures.
          cache-key-prefix: 'cp2112-utility-qt-6.12.0-win64-mingw'

      # Action: compile the CLI executable using its pipeline-specific name.
      - name: Build executable
        shell: pwsh
        env:
          EXECUTABLE_NAME: ${{ steps.package.outputs.executable_name }}
        run: |
          # Create directories and remove older locally generated CLI executables.
          New-Item -ItemType Directory -Force 'bin\cli', logs | Out-Null
          Get-ChildItem 'bin\cli' -Filter '*.exe' -File | Remove-Item -Force

          # Compile and dynamically link the CLI with WinLibs explicitly.
          # Do not use PATH here because the Qt action prepends its own compiler.
          $cliCompiler = Join-Path $env:CP2112_WINLIBS_BIN 'g++.exe'
          & $cliCompiler -m64 -std=c++17 -O2 -Wall -Wextra -Iinclude `
            src\main.cpp src\Application.cpp src\DriverRegistry.cpp `
            drivers\BMP280.cpp drivers\MPU6050.cpp drivers\BH1750.cpp `
            drivers\DS3231.cpp drivers\BQ4050.cpp `
            drivers\24C32BN.cpp drivers\SSD1306.cpp `
            build\app-res.o `
            -o "bin\cli\$env:EXECUTABLE_NAME.exe"

      # Action: configure and build the Qt GUI against the shared application service.
      - name: Build Qt GUI
        shell: pwsh
        run: |
          # Confirm that the Qt action supplied a usable installation root.
          if (-not $env:QT_ROOT_DIR) {
            throw 'QT_ROOT_DIR was not provided by install-qt-action.'
          }
          if (-not (Test-Path (Join-Path $env:QT_ROOT_DIR 'lib\cmake\Qt6'))) {
            throw "Qt 6 CMake package was not found below QT_ROOT_DIR: $env:QT_ROOT_DIR"
          }

          # Build the GUI with the MinGW kit used to build the installed Qt DLLs.
          # The CLI uses the separately pinned WinLibs compiler and keeps its
          # dynamic runtime beside the CLI executable.
          # QT_ROOT_DIR is ...\Qt\6.12.0\mingw_64; the action installs tools
          # beside the version directory at ...\Qt\Tools, not below QT_ROOT_DIR.
          $qtInstallRoot = Split-Path (Split-Path $env:QT_ROOT_DIR -Parent) -Parent
          $qtToolsRoot = Join-Path $qtInstallRoot 'Tools'
          $qtCompiler = Get-ChildItem -Path $qtToolsRoot -Filter 'g++.exe' -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'mingw' } |
            Select-Object -First 1
          if (-not $qtCompiler) {
            throw "Qt's bundled MinGW compiler was not found below $qtToolsRoot"
          }
          $qtCompilerBin = Split-Path $qtCompiler.FullName
          $qtCompilerTarget = (& (Join-Path $qtCompilerBin 'g++') -dumpmachine).Trim()
          if ($qtCompilerTarget -notmatch 'x86_64|amd64') {
            throw "Qt's compiler is not 64-bit: $qtCompilerTarget"
          }
          Write-Host "Using Qt MinGW compiler: $($qtCompiler.FullName)"

          # Use Ninja and explicitly select the Qt-compatible 64-bit compiler.
          cmake -S cp2112-utility-gui `
                -B cp2112-utility-gui\build\release `
                -G Ninja `
                -DCMAKE_BUILD_TYPE=Release `
                -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
                -DCMAKE_CXX_COMPILER="$($qtCompiler.FullName)" `
                -DCP2112_SKIP_RUNTIME_COPY=ON
          if ($LASTEXITCODE -ne 0) { throw "Qt GUI CMake configuration failed with exit code $LASTEXITCODE" }

          cmake --build cp2112-utility-gui\build\release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Qt GUI build failed with exit code $LASTEXITCODE" }

          # The GUI CMake post-build step places the GUI executable in bin/gui.
          if (-not (Test-Path 'bin\gui\cp2112-utility-gui.exe')) {
            throw 'The Qt GUI executable was not produced in bin/gui.'
          }

          # Add Qt runtime files to bin/gui only when the repository does not already contain them.
          New-Item -ItemType Directory -Force 'bin\gui\platforms' | Out-Null
          $qtRuntimeFiles = @('Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Widgets.dll')
          foreach ($runtimeName in $qtRuntimeFiles) {
            $destination = Join-Path 'bin\gui' $runtimeName
            if (-not (Test-Path $destination)) {
              $source = Join-Path $env:QT_ROOT_DIR "bin\$runtimeName"
              if (-not (Test-Path $source)) { throw "Qt runtime file was not found: $source" }
              Copy-Item $source $destination
            } else {
              Write-Host "Keeping repository Qt runtime DLL: $destination"
            }
          }
          # Copy Qt MinGW runtime files only when the repository does not already
          # contain them. This preserves the tracked, known-good DLL versions.
          $qtMinGWRuntimeFiles = @('libgcc_s_seh-1.dll', 'libstdc++-6.dll', 'libwinpthread-1.dll')
          foreach ($runtimeName in $qtMinGWRuntimeFiles) {
            $destination = Join-Path 'bin\gui' $runtimeName
            if (-not (Test-Path $destination)) {
              $source = Join-Path $qtCompilerBin $runtimeName
              if (-not (Test-Path $source)) { throw "Qt MinGW runtime file was not found: $source" }
              Copy-Item $source $destination
            } else {
              Write-Host "Keeping repository Qt MinGW runtime: $destination"
            }
          }
          $platformDestination = 'bin\gui\platforms\qwindows.dll'
          if (-not (Test-Path $platformDestination)) {
            $platformSource = Join-Path $env:QT_ROOT_DIR 'plugins\platforms\qwindows.dll'
            if (-not (Test-Path $platformSource)) { throw "Qt platform plugin was not found: $platformSource" }
            Copy-Item $platformSource $platformDestination
          } else {
            Write-Host "Keeping repository Qt platform plugin: $platformDestination"
          }

      # Action: verify that the executable and Silicon Labs DLLs use the same
      # PE architecture, preventing Windows error 193 packages.
      - name: Check executable and SDK DLL architectures
        shell: pwsh
        env:
          EXECUTABLE_NAME: ${{ steps.package.outputs.executable_name }}
        run: |
          # Locate objdump from the separately pinned CLI toolchain, not Qt's PATH entry.
          $toolchainBin = $env:CP2112_WINLIBS_BIN
          $objdump = Join-Path $toolchainBin 'objdump.exe'
          # Determine the PE format expected from the compiler target.
          $target = (& (Join-Path $toolchainBin 'g++.exe') -dumpmachine).Trim()
          $expectedFormat = if ($target -match 'x86_64|amd64') {
            'pei-x86-64'
          } elseif ($target -match 'i[3-6]86|mingw32') {
            'pei-i386'
          } else {
            throw "Unsupported compiler architecture target: $target"
          }

          # Check the executable and both vendor DLLs before packaging.
          $files = @(
            "bin\cli\$env:EXECUTABLE_NAME.exe",
            'bin\gui\cp2112-utility-gui.exe',
            'bin\cli\SLABHIDDevice.dll',
            'bin\cli\SLABHIDtoSMBus.dll',
            'bin\gui\SLABHIDDevice.dll',
            'bin\gui\SLABHIDtoSMBus.dll'
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Required architecture-check file is missing: $file"
            }
            $format = (& $objdump -f $file | Select-String 'file format').ToString()
            if ($format -notmatch $expectedFormat) {
              throw "Architecture mismatch in $file. Compiler target '$target' requires '$expectedFormat', but objdump reported: $format"
            }
            Write-Host "$file matches $expectedFormat"
          }

      # Action: bundle the MinGW runtime DLLs required by the dynamically linked CLI.
      - name: Bundle MinGW runtime DLLs
        shell: pwsh
        env:
          EXECUTABLE_NAME: ${{ steps.package.outputs.executable_name }}
        run: |
          # Locate the executable and the exact WinLibs runtime source directory.
          # Never search PATH: Qt's MinGW runtime may appear there after Qt setup.
          $toolchainBin = $env:CP2112_WINLIBS_BIN
          $objdump = Join-Path $toolchainBin 'objdump.exe'
          $cliDirectory = Join-Path $PWD 'bin\cli'
          $executable = Join-Path $cliDirectory "$env:EXECUTABLE_NAME.exe"

          if (-not (Test-Path $objdump)) {
            throw "objdump.exe was not found beside g++ at $toolchainBin"
          }

          # Walk the executable's transitive imports to discover required runtimes.
          $searchDirectories = @($toolchainBin)
          $runtimePaths = @{}
          $missingRuntime = @()
          $inspected = @{}
          $filesToInspect = New-Object System.Collections.Queue
          $filesToInspect.Enqueue($executable)

          # Inspect each imported runtime DLL because dependencies can be transitive.
          while ($filesToInspect.Count -gt 0) {
            $currentFile = $filesToInspect.Dequeue()
            $resolvedCurrentFile = (Resolve-Path $currentFile).Path.ToLowerInvariant()
            if ($inspected.ContainsKey($resolvedCurrentFile)) { continue }
            $inspected[$resolvedCurrentFile] = $true

            # Read imported DLL names from the current executable or runtime DLL.
            $dependencies = & $objdump -p $currentFile |
              Select-String 'DLL Name:' |
              ForEach-Object { ($_ -split 'DLL Name:\s*', 2)[1].Trim() } |
              Sort-Object -Unique

            # Resolve each MinGW runtime from the pinned toolchain directories.
            foreach ($dependency in $dependencies) {
              if ($dependency -notmatch '^(libgcc|libstdc\+\+|libwinpthread|libmcfgthread|mingw|libssp|libatomic|libgomp|libquadmath)') {
                continue
              }
              if (-not $runtimePaths.ContainsKey($dependency)) {
                $found = $null
                foreach ($directory in $searchDirectories) {
                  $candidate = Join-Path $directory $dependency
                  if (Test-Path $candidate) {
                    $found = $candidate
                    break
                  }
                }
                if ($found) {
                  $runtimePaths[$dependency] = $found
                  $filesToInspect.Enqueue($found)
                } else {
                  $missingRuntime += $dependency
                }
              }
            }
          }
          # Stop before packaging if any imported MinGW runtime could not be found.
          $missingRuntime = @($missingRuntime | Sort-Object -Unique)
          if ($missingRuntime.Count -gt 0) {
            throw "Required WinLibs runtime DLL(s) were not found in ${toolchainBin}: $($missingRuntime -join ', ')"
          }
          $runtimeDependencies = @($runtimePaths.Keys | Sort-Object)
          Write-Host "Imported MinGW runtime DLLs: $($runtimeDependencies -join ', ')"

          # Copy all CLI imports discovered from the executable and its dependencies.
          $bundled = @()
          foreach ($dependency in $runtimeDependencies) {
            $destination = Join-Path 'bin\cli' $dependency
            $source = $runtimePaths[$dependency]
            if (-not (Test-Path $destination) -or
                (Get-FileHash $destination -Algorithm SHA256).Hash -ne (Get-FileHash $source -Algorithm SHA256).Hash) {
              # Replace a stale or foreign runtime with the exact WinLibs copy.
              Copy-Item $source $destination -Force
              Write-Host "Copied WinLibs runtime DLL: $destination"
            } else {
              Write-Host "Keeping matching WinLibs runtime DLL: $destination"
            }
            if ($bundled -notcontains $dependency) { $bundled += $dependency }
          }

          # Include the runtime DLL naming variants shipped by WinLibs in bin/cli.
          # Explicitly include the runtime names shipped by the pinned WinLibs
          # archive, including the MCF runtime libmcfgthread-2.dll.
          $explicitRuntimeFiles = Get-ChildItem -Path $toolchainBin -File |
            Where-Object { $_.Name -match '^(libgcc_s_seh-\d+\.dll|libstdc\+\+-\d+\.dll|libwinpthread-\d+\.dll|libmcfgthread-\d+\.dll)$' }
          foreach ($runtimeFile in $explicitRuntimeFiles) {
            $destination = Join-Path 'bin\cli' $runtimeFile.Name
            if (-not (Test-Path $destination) -or
                (Get-FileHash $destination -Algorithm SHA256).Hash -ne (Get-FileHash $runtimeFile.FullName -Algorithm SHA256).Hash) {
              # Ensure every shipped runtime variant comes from WinLibs.
              Copy-Item $runtimeFile.FullName $destination -Force
              Write-Host "Copied WinLibs runtime DLL: $destination"
            } else {
              Write-Host "Keeping matching WinLibs runtime DLL: $destination"
            }
            if ($bundled -notcontains $runtimeFile.Name) { $bundled += $runtimeFile.Name }
          }

          if ($bundled.Count -eq 0) {
            throw 'No MinGW runtime DLL was bundled for the dynamically linked CLI.'
          }

          # Verify that every required CLI runtime DLL is physically in bin/cli.
          $requiredRuntimeNames = @('libgcc_s_seh-1.dll', 'libstdc++-6.dll') +
            @($explicitRuntimeFiles |
              Where-Object { $_.Name -like 'libwinpthread-*.dll' -or $_.Name -like 'libmcfgthread-*.dll' } |
              ForEach-Object Name)
          $missingPackagedRuntime = @($requiredRuntimeNames | Where-Object { -not (Test-Path (Join-Path 'bin\cli' $_)) })
          if ($missingPackagedRuntime.Count -gt 0) {
            throw "Required MinGW runtime DLL(s) were not packaged: $($missingPackagedRuntime -join ', ')"
          }
          Write-Host "Bundled runtime DLLs: $($bundled -join ', ')"

      # Action: commit and push metadata only after compilation succeeds.
      - name: Commit build metadata
        id: metadata
        shell: pwsh
        env:
          BUILD_NUMBER: ${{ steps.package.outputs.build_number }}
          SOURCE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.pull_request.head.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Identify the bot as the author of CI metadata commits.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Stage only the generated configuration metadata.
          git add config\devices.ini
          if (git diff --cached --quiet) {
            # Reuse the checked-out revision when metadata already matches.
            $commit = git rev-parse HEAD
          } else {
            # Commit and push metadata only after compilation and packaging prerequisites succeed.
            git commit -m "ci: update build metadata for $env:BUILD_NUMBER"
            $repositoryUrl = "https://x-access-token:$env:GITHUB_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
            git -c credential.helper= -c core.askPass= push $repositoryUrl "HEAD:$env:SOURCE_BRANCH"
            $commit = git rev-parse HEAD
          }
          "commit=$commit" >> $env:GITHUB_OUTPUT

      # Action: package the complete bin directory as the downloadable release asset.
      - name: Package bin directory
        id: archive
        shell: pwsh
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.package_name }}
        run: |
          # Create the ZIP using the production/beta package name.
          $package = "$env:PACKAGE_NAME.zip"
          Compress-Archive -Path bin, config -DestinationPath $package -Force
          "package=$package" >> $env:GITHUB_OUTPUT

      # Action: upload the package as a workflow artifact.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: ${{ steps.archive.outputs.package }}
          if-no-files-found: error

      # Action: create the matching Git tag and publish the package as a release.
      - name: Create GitHub release and matching tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ steps.package.outputs.package_name }}
          PACKAGE_PATH: ${{ steps.archive.outputs.package }}
          IS_BETA: ${{ github.event.action != 'closed' }}
          TARGET_SHA: ${{ steps.metadata.outputs.commit }}
        shell: pwsh
        run: |
          # Create the GitHub Release, using the package name as both tag and release title.
          $args = @(
            'release', 'create', $env:RELEASE_NAME, $env:PACKAGE_PATH,
            '--title', $env:RELEASE_NAME,
            '--target', $env:TARGET_SHA,
            '--generate-notes'
          )
          # Mark beta builds as prereleases; merged production builds remain stable releases.
          if ($env:IS_BETA -eq 'true') {
            $args += '--prerelease'
          }
          gh @args
