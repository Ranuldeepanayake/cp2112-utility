# Triggers on develop-to-main pull requests when opened or approved, and on
# manual workflow dispatches from develop only.
name: Build and release CP2112 utility

on:
  pull_request:
    branches:
      - main
    types:
      - opened
  pull_request_review:
    branches:
      - main
    types:
      - submitted
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    # PR builds are limited to an open/approved PR from develop to main.
    # Manual runs are accepted only when the selected ref is develop.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'opened' &&
       github.event.pull_request.head.ref == 'develop' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.base.ref == 'main') ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved' &&
       github.event.pull_request.head.ref == 'develop' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.base.ref == 'main')
    runs-on: windows-latest

    # Action: check out the exact source revision that will be compiled.
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Build the develop source for PR events, rather than the synthetic
          # merge ref GitHub creates for pull_request workflows.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.pull_request.head.sha }}

      # Action: create the artifact name before compiling so the executable
      # filename and package name are identical.
      - name: Create release package name
        id: package
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $date = Get-Date -Format 'ddMMyyyy'
          $suffix = if ($env:EVENT_NAME -eq 'pull_request_review' -and '${{ github.event.review.state }}' -eq 'approved') { '' } else { '-beta' }
          $name = "cp2112_console-$date-$env:GITHUB_RUN_NUMBER$suffix"
          $beta = if ($suffix) { 'true' } else { 'false' }
          "name=$name" >> $env:GITHUB_OUTPUT
          "build_timestamp=$date" >> $env:GITHUB_OUTPUT
          "build_number=$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT
          "beta=$beta" >> $env:GITHUB_OUTPUT

      # Action: prepare CI build metadata in the working copy for this build.
      - name: Prepare packaged build metadata
        shell: pwsh
        env:
          BUILD_TIMESTAMP: ${{ steps.package.outputs.build_timestamp }}
          BUILD_NUMBER: ${{ steps.package.outputs.build_number }}
          BETA: ${{ steps.package.outputs.beta }}
        run: |
          $configPath = 'config\devices.ini'
          $config = Get-Content $configPath -Raw
          $config = [regex]::Replace($config, '(?m)^build_timestamp=.*$', "build_timestamp=$env:BUILD_TIMESTAMP")
          $config = [regex]::Replace($config, '(?m)^build_number=.*$', "build_number=$env:BUILD_NUMBER")
          $config = [regex]::Replace($config, '(?m)^beta=.*$', "beta=$env:BETA")
          Set-Content -Path $configPath -Value $config -Encoding utf8

      # Action: verify that the README-required MinGW-w64 C++ toolchain exists.
      - name: Check MinGW-w64 toolchain
        shell: pwsh
        run: |
          $compiler = Get-Command g++ -ErrorAction SilentlyContinue
          if (-not $compiler) {
            throw 'g++ was not found on the Windows runner. Install MinGW-w64 or update the runner toolchain configuration.'
          }
          g++ --version
          $target = (& g++ -dumpmachine).Trim()
          if ($target -notmatch 'mingw') {
            throw "The available g++ is not a MinGW toolchain: $target"
          }

      # Action: compile the executable using the artifact name as its output filename.
      - name: Build executable
        shell: pwsh
        env:
          ARTIFACT_NAME: ${{ steps.package.outputs.name }}
        run: |
          New-Item -ItemType Directory -Force bin, logs | Out-Null
          Get-ChildItem bin -Filter '*.exe' -File | Remove-Item -Force
          g++ -std=c++17 -O2 -Wall -Wextra -Iinclude `
            src\main.cpp src\Application.cpp src\DriverRegistry.cpp `
            drivers\BMP280.cpp drivers\MPU6050.cpp drivers\BH1750.cpp `
            drivers\DS3231.cpp drivers\BQ4050.cpp `
            -o "bin\$env:ARTIFACT_NAME.exe"

      # Action: bundle the MinGW runtime DLLs required by the compiled executable.
      - name: Bundle MinGW runtime DLLs
        shell: pwsh
        env:
          ARTIFACT_NAME: ${{ steps.package.outputs.name }}
        run: |
          $toolchainBin = Split-Path (Get-Command g++).Source
          $objdump = Join-Path $toolchainBin 'objdump.exe'
          $executable = Join-Path $PWD "bin\$env:ARTIFACT_NAME.exe"

          if (-not (Test-Path $objdump)) {
            throw "objdump.exe was not found beside g++ at $toolchainBin"
          }

          $dependencies = & $objdump -p $executable |
            Select-String 'DLL Name:' |
            ForEach-Object { ($_ -split 'DLL Name:\s*', 2)[1].Trim() } |
            Sort-Object -Unique

          $bundled = @()
          foreach ($dependency in $dependencies) {
            $runtimeDll = Join-Path $toolchainBin $dependency
            if (Test-Path $runtimeDll) {
              Copy-Item $runtimeDll bin -Force
              $bundled += $dependency
            }
          }

          if (-not ($bundled | Where-Object { $_ -match '^(libgcc|libstdc\+\+|libwinpthread|mingw)' })) {
            throw 'No MinGW runtime DLL was bundled; the release may fail on machines without MinGW installed.'
          }
          Write-Host "Bundled runtime DLLs: $($bundled -join ', ')"

      # Action: commit and push metadata only after compilation succeeds.
      - name: Commit build metadata
        id: metadata
        shell: pwsh
        env:
          BUILD_NUMBER: ${{ steps.package.outputs.build_number }}
          SOURCE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.pull_request.head.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config\devices.ini
          if (git diff --cached --quiet) {
            $commit = git rev-parse HEAD
          } else {
            git commit -m "ci: update build metadata for $env:BUILD_NUMBER"
            git -c "http.extraheader=AUTHORIZATION: bearer $env:GITHUB_TOKEN" push origin "HEAD:$env:SOURCE_BRANCH"
            $commit = git rev-parse HEAD
          }
          "commit=$commit" >> $env:GITHUB_OUTPUT

      # Action: package the complete bin directory as the downloadable release asset.
      - name: Package bin directory
        id: archive
        shell: pwsh
        env:
          ARTIFACT_NAME: ${{ steps.package.outputs.name }}
        run: |
          $package = "$env:ARTIFACT_NAME.zip"
          Compress-Archive -Path bin, config -DestinationPath $package -Force
          "package=$package" >> $env:GITHUB_OUTPUT

      # Action: upload the package as a workflow artifact.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.archive.outputs.package }}
          if-no-files-found: error

      # Action: create the matching Git tag and publish the package as a release.
      - name: Create GitHub release and matching tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_PATH: ${{ steps.archive.outputs.package }}
          IS_BETA: ${{ github.event_name != 'pull_request_review' }}
          TARGET_SHA: ${{ steps.metadata.outputs.commit }}
        shell: pwsh
        run: |
          $args = @(
            'release', 'create', $env:RELEASE_NAME, $env:PACKAGE_PATH,
            '--title', $env:RELEASE_NAME,
            '--target', $env:TARGET_SHA,
            '--generate-notes'
          )
          if ($env:IS_BETA -eq 'true') {
            $args += '--prerelease'
          }
          gh @args
