# CP2112 Device Console configuration
# Values support decimal or 0x-prefixed hexadecimal notation.
# This is an INI-like text file. Device type selects a compiled-in driver;
# C++ headers are compile-time files and cannot be selected at runtime.

[general]
bridge_dll=SLABHIDtoSMBus.dll
log_dir=logs
version=1.2.0
build_timestamp=201020260328
build_number=38
beta=true
dark_mode=false
theme=light
default_refresh_seconds=1
default_log_stream=true
scan_adapter_index=0
scan_start_address=0x08
scan_end_address=0x77
scan_clock_hz=100000
transfer_timeout_ms=50
transfer_retries=0
log_retention_days=7
gpio_activity_enabled=true
gpio_error_pattern_enabled=true
gpio_error_pin=2

[device BMP280-1]
type=bmp280
address=0x76
clock_hz=100000
adapter_index=0
refresh_seconds=1
log_stream=true
enabled=true

[device MPU6050-1]
type=mpu6050
address=0x68
clock_hz=100000
adapter_index=0
refresh_seconds=1
log_stream=true
# Disabled by default because DS3231 below also commonly uses 0x68.
# Enable only if AD0 is high (address 0x69), or use a separate adapter/bus.
enabled=yes

[device BH1750-1]
type=bh1750
address=0x23
clock_hz=100000
adapter_index=0
refresh_seconds=1
log_stream=true
enabled=true

[device DS3231-1]
type=ds3231
address=0x68
clock_hz=100000
adapter_index=0
refresh_seconds=5
log_stream=true
enabled=true

# Many DS3231 modules include an AT24C32/24C32BN EEPROM at 0x57.
# It is disabled by default because the EEPROM may not be fitted or may use
# a different strapped address. Enable it only after confirming the hardware.
[device 24C32BN-1]
type=24c32bn
address=0x57
clock_hz=100000
adapter_index=0
refresh_seconds=5
log_stream=true
enabled=true

# Common SSD1306 128x64 OLED modules use 0x3C; 0x3D is selected by the SA0 strap.
# The driver uses an action-local 1024-byte framebuffer and does not claim to
# support identity reads, hardware calibration, or software address changes.
[device SSD1306-1]
type=ssd1306
address=0x3C
clock_hz=400000
adapter_index=0
refresh_seconds=5
log_stream=true
enabled=true

[device BQ4050-1]
type=bq4050
address=0x0B
clock_hz=100000
adapter_index=0
refresh_seconds=5
log_stream=true
enabled=true






























