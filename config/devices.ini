# CP2112 Device Console configuration
# Values support decimal or 0x-prefixed hexadecimal notation.
# This is an INI-like text file. Device type selects a compiled-in driver;
# C++ headers are compile-time files and cannot be selected at runtime.

[general]
bridge_dll=bin\SLABHIDtoSMBus.dll
log_dir=logs
build_timestamp=13102026
build_number=13
beta=false
default_refresh_seconds=2
default_log_stream=true
scan_adapter_index=0
scan_start_address=0x08
scan_end_address=0x77
scan_clock_hz=100000
transfer_timeout_ms=500
log_retention_days=30

[device BMP280-1]
type=bmp280
address=0x76
clock_hz=100000
adapter_index=0
refresh_seconds=2
log_stream=true
enabled=true

[device MPU6050-1]
type=mpu6050
address=0x68
clock_hz=100000
adapter_index=0
refresh_seconds=1
log_stream=true
# Disabled by default because DS3231 below also commonly uses 0x68.
# Enable only if AD0 is high (address 0x69), or use a separate adapter/bus.
enabled=false

[device BH1750-1]
type=bh1750
address=0x23
clock_hz=100000
adapter_index=0
refresh_seconds=2
log_stream=true
enabled=true

[device DS3231-1]
type=ds3231
address=0x68
clock_hz=100000
adapter_index=0
refresh_seconds=5
log_stream=true
enabled=true

[device BQ4050-1]
type=bq4050
address=0x0B
clock_hz=100000
adapter_index=0
refresh_seconds=5
log_stream=true
enabled=true










